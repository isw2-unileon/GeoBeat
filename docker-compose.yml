services:
  geobeat-test-db:
    image: postgres:15-alpine
    container_name: geobeat-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: geobeat_test
    ports:
      - "5433:5432"
    restart: unless-stopped
    tmpfs:
      - /var/lib/postgresql/data
